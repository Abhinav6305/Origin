<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · HACK-A-THON 2.0</title>
<link rel="icon" href="../assets/origin-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0d0d0c;--ink:#f2f2ef;--dim:#a3a39e;--faint:#3a3a37;--line:rgba(242,242,239,.14);--wht:#fff;--blk:#050505;--blk-dim:#4a4a48;
  --ok:#9be59b;--no:#ff9a8a;--wait:#f2d27a;
  --disp:"Anton","Impact","Arial Narrow",sans-serif;--body:"Poppins","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wht);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:clamp(14px,3vw,36px)}

header{border-bottom:1px solid var(--line);background:#030303;position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:28px}.brand b{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.02em}
.brand span{font-size:11px;font-weight:700;letter-spacing:.18em;padding:2px 7px;background:var(--wht);color:var(--blk)}
.who{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--dim)}
.who a{color:var(--ink)}

main{padding:28px 0 60px}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1}
.sub{color:var(--dim);margin-top:4px}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:22px}
.tile{border:1px solid var(--line);background:var(--card);padding:14px 16px;text-align:left;cursor:pointer;transition:border-color .2s}
.tile:hover{border-color:var(--dim)}
.tile[aria-pressed="true"]{border-color:var(--wht);background:#151514}
.tile b{display:block;font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.05}
.tile span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tile i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:20px}
.search{flex:1;min-width:220px;max-width:420px;position:relative}
.search input{width:100%;min-height:44px;padding:10px 12px 10px 38px;background:var(--card);border:1.5px solid var(--faint);font-size:15px}
.search input:focus{outline:none;border-color:var(--wht)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;font-weight:600;font-size:13.5px;border:1.5px solid var(--wht);background:transparent;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--wht);color:var(--blk)}
.btn.solid{background:var(--wht);color:var(--blk)}
.btn.solid:hover{background:transparent;color:var(--wht)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:12.5px}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.ok:hover{background:var(--ok);color:var(--blk)}
.btn.no{border-color:var(--no);color:var(--no)}.btn.no:hover{background:var(--no);color:var(--blk)}
.btn[disabled]{opacity:.4;pointer-events:none}

.tablewrap{margin-top:16px;border:1px solid var(--line);background:var(--card);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{text-align:left;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:12px;border-bottom:1px solid var(--line);background:var(--card);white-space:nowrap}
th button{background:none;border:0;color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;cursor:pointer}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:#151514}
td.team b{display:block;font-weight:600}
td.team small,td.lead small{color:var(--dim);font-size:12.5px;display:block;overflow-wrap:anywhere}
td.idea{max-width:300px}
td.lead{min-width:240px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.under_review{color:var(--wait)}.pill.approved{color:var(--ok)}.pill.rejected{color:var(--no)}
.tid{font-family:var(--disp);font-weight:400;font-size:18px;letter-spacing:.04em;white-space:nowrap}
.tid.none{font-family:var(--body);font-size:13px;color:var(--dim)}
.acts{display:flex;gap:6px;white-space:nowrap}
.empty{padding:48px 20px;text-align:center;color:var(--dim)}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#0a0a09;border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.05;overflow-wrap:anywhere;margin-top:8px}
.dh .x{width:40px;height:40px;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px;flex:none}
.db{padding:18px 22px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:14px}
.kv span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;padding-top:3px}
.kv div{overflow-wrap:anywhere}
.idbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px;padding:14px 16px;background:var(--wht);color:var(--blk)}
.idbox small{display:block;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--blk-dim)}
.idbox b{font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.04em;line-height:1.1}
.idbox button{border:1px solid var(--blk);background:none;color:var(--blk);padding:6px 12px;cursor:pointer;font-size:13px}
.mem{border:1px solid var(--line);padding:12px 14px;margin-top:10px}
.mem b{display:block}
.mem small{color:var(--dim);font-size:13px;display:block;overflow-wrap:anywhere}
.mem em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.14em;padding:2px 6px;background:var(--wht);color:var(--blk);margin-left:6px;vertical-align:2px}
.sec{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:22px}
.df{display:flex;flex-wrap:wrap;gap:8px;padding:16px 22px;border-top:1px solid var(--line)}
.df .btn{flex:1;justify-content:center;min-height:46px}

.toast{position:fixed;left:24px;bottom:24px;transform:translateY(20px);background:var(--wht);color:var(--blk);padding:12px 18px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:none}
.gate{max-width:520px;margin:12vh auto;padding:28px;border:1px solid var(--line);background:var(--card);text-align:center}
.gate{text-align:left}.gate h1{font-size:40px;text-align:center}.gate>p{color:var(--dim);margin:6px 0 22px;text-align:center}
.lf{display:grid;gap:6px;margin-bottom:14px}.lf span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.lf input{min-height:48px;padding:10px 12px;background:#050505;border:1.5px solid var(--faint);font-size:16px}.lf input:focus{outline:none;border-color:var(--wht)}
.gate .lerr{color:var(--no);font-size:14px;margin:-4px 0 12px;text-align:left}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:13px}

@media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.who span{display:none}.brand b{font-size:16px}.kv{grid-template-columns:1fr;gap:2px}.kv span{margin-top:8px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html"><img src="../assets/origin-logo.png" alt="ORIGIN"><b>HACK-A-THON 2.0</b><span>ADMIN</span></a>
  <div class="who"><span id="who"></span><button type="button" id="logout" class="linkbtn" hidden>Sign out</button></div>
</div></header>

<main><div class="wrap">
  <form id="gate" class="gate" hidden novalidate>
    <h1>ADMIN LOGIN</h1><p>HACK-A-THON 2.0 organisers only.</p>
    <label class="lf"><span>Email</span><input type="email" id="lEmail" autocomplete="username" required></label>
    <label class="lf"><span>Password</span><input type="password" id="lPass" autocomplete="current-password" required></label>
    <p class="lerr" id="lErr" role="alert" hidden></p>
    <button class="btn solid" type="submit" id="lBtn" style="width:100%;justify-content:center;min-height:48px">Sign in</button>
  </form>

  <div id="app" hidden>
    <h1>REGISTRATIONS</h1>
    <p class="sub">Round 1 · abstract review. Approving a team gives it a permanent Team ID (HACK2-001, HACK2-002, …).</p>

    <div class="tiles" id="tiles" role="group" aria-label="Filter by status">
      <button class="tile" type="button" data-f="all" aria-pressed="true"><b id="c-all">0</b><span>All teams</span></button>
      <button class="tile" type="button" data-f="under_review" aria-pressed="false"><b id="c-under_review">0</b><span><i style="background:var(--wait)"></i>Under review</span></button>
      <button class="tile" type="button" data-f="approved" aria-pressed="false"><b id="c-approved">0</b><span><i style="background:var(--ok)"></i>Approved</span></button>
      <button class="tile" type="button" data-f="rejected" aria-pressed="false"><b id="c-rejected">0</b><span><i style="background:var(--no)"></i>Rejected</span></button>
      <div class="tile" style="cursor:default"><b id="c-people">0</b><span>Participants</span></div>
    </div>

    <div class="bar">
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search team, idea, email, college, Team ID" aria-label="Search registrations"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="refresh" type="button">↻ Refresh</button><button class="btn solid" id="csv" type="button">Export CSV</button></div>
    </div>

    <div class="tablewrap"><table>
      <thead><tr>
        <th><button type="button" data-sort="createdAt">Submitted ↓</button></th><th><button type="button" data-sort="teamName">Team</button></th><th>Team leader</th><th>Size</th><th>Idea title</th><th>Status</th><th><button type="button" data-sort="teamId">Team ID</button></th><th>Actions</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table><div class="empty" id="empty" hidden>No registrations match.</div></div>
  </div>
</div></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="dh"><div><span class="pill" id="dPill"></span><h2 id="dTitle"></h2></div><button class="x" id="dClose" type="button" aria-label="Close">✕</button></div>
  <div class="db" id="dBody"></div>
  <div class="df"><a class="btn" id="dPdf" target="_blank" rel="noopener">Open abstract PDF ↗</a><button class="btn ok" id="dApprove" type="button">Approve</button><button class="btn no" id="dReject" type="button">Reject</button><button class="btn" id="dReset" type="button">Back to review</button></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = { under_review:"UNDER REVIEW", approved:"APPROVED", rejected:"REJECTED" };
let teams = [], filter = "all", sortKey = "createdAt", sortDir = -1, openId = null;

const fmtDate = iso => new Date(iso).toLocaleString("en-IN", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Kolkata" });
const pill = s => `<span class="pill ${esc(s)}"><i></i>${LABEL[s] || esc(s)}</span>`;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }

async function api(path, opts){
  const r = await fetch(path, { credentials:"same-origin", ...opts });
  if (r.status === 401 || r.status === 403) { const e = new Error("auth"); e.auth = true; throw e; }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Error ${r.status}`);
  return body;
}
async function who(){ try { const r = await fetch("/api/manage/me", { credentials:"same-origin" }); if (!r.ok) return; const j = await r.json(); $("#who").textContent = j.email; $("#logout").hidden = false; } catch {} }
function showLogin(){ $("#app").hidden = true; $("#gate").hidden = false; $("#logout").hidden = true; $("#who").textContent = ""; setTimeout(() => $("#lEmail").focus(), 50); }
$("#gate").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#lBtn"), err = $("#lErr"); err.hidden = true; btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const r = await fetch("/api/manage/login", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email:$("#lEmail").value, password:$("#lPass").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Sign-in failed.");
    $("#lPass").value = ""; await who(); await load();
  } catch (x) { err.textContent = x.message; err.hidden = false; $("#lPass").select(); }
  finally { btn.disabled = false; btn.textContent = "Sign in"; }
});
$("#logout").onclick = async () => { await fetch("/api/manage/logout", { method:"POST", credentials:"same-origin" }).catch(() => {}); teams = []; showLogin(); toast("Signed out"); };

async function load(){
  try { const { teams: t } = await api("/api/manage/teams"); teams = t; $("#gate").hidden = true; $("#app").hidden = false; render(); return true; }
  catch (e) { if (e.auth) showLogin(); else toast("Couldn't load registrations: " + e.message); return false; }
}

function matches(t, q){
  if (!q) return true;
  const hay = [t.teamName, t.ideaTitle, t.teamId, ...t.members.flatMap(m => [m.name, m.email, m.college])].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function render(){
  const counts = { all:teams.length, under_review:0, approved:0, rejected:0 };
  teams.forEach(t => { if (t.round1 in counts) counts[t.round1]++; });
  Object.entries(counts).forEach(([k,v]) => $("#c-"+k).textContent = v);
  $("#c-people").textContent = teams.reduce((n,t) => n + (t.teamSize || 0), 0);
  $$("#tiles [data-f]").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));

  const q = $("#q").value.trim().toLowerCase();
  const list = teams.filter(t => (filter === "all" || t.round1 === filter) && matches(t, q))
    .sort((a,b) => String(a[sortKey] ?? "~").localeCompare(String(b[sortKey] ?? "~"), undefined, { numeric:true }) * sortDir);
  $("#empty").hidden = list.length > 0;
  $("#empty").textContent = teams.length ? "No registrations match." : "No registrations yet.";
  $("#rows").innerHTML = list.map(t => { const L = t.members[0] || {}; return `
    <tr data-id="${esc(t.id)}" tabindex="0">
      <td class="num">${esc(fmtDate(t.createdAt))}</td>
      <td class="team"><b>${esc(t.teamName)}</b><small>${esc(L.college)}</small></td>
      <td class="lead">${esc(L.name)}<small>${esc(L.email)}</small></td>
      <td class="num">${Number(t.teamSize) || ""}</td>
      <td class="idea">${esc(t.ideaTitle)}</td>
      <td>${pill(t.round1)}</td>
      <td>${t.teamId ? `<span class="tid">${esc(t.teamId)}</span>` : `<span class="tid none">—</span>`}</td>
      <td><div class="acts">
        <a class="btn sm" href="/api/manage/abstract?id=${encodeURIComponent(t.id)}" target="_blank" rel="noopener" data-stop>PDF</a>
        <button class="btn sm ok" type="button" data-act="approve" ${t.round1 === "approved" ? "disabled" : ""}>Approve</button>
        <button class="btn sm no" type="button" data-act="reject" ${t.round1 === "rejected" ? "disabled" : ""}>Reject</button>
      </div></td>
    </tr>`; }).join("");
  $$("#rows tr").forEach(tr => {
    tr.onclick = e => { if (e.target.closest("[data-stop]")) return; const a = e.target.closest("[data-act]"); if (a) review(tr.dataset.id, a.dataset.act); else openDrawer(tr.dataset.id); };
    tr.onkeydown = e => { if (e.key === "Enter" && e.target === tr) openDrawer(tr.dataset.id); };
  });
  if (openId) fillDrawer(teams.find(t => t.id === openId));
}

// Reject needs a second click within 4 s (in-page confirm; no browser dialogs)
let pendingReject = null;
function confirmReject(t){ if (pendingReject === t.id) { pendingReject = null; return true; } pendingReject = t.id; toast(`Click Reject again to confirm rejecting ${t.teamName}`); setTimeout(() => { if (pendingReject === t.id) pendingReject = null; }, 4000); return false; }

async function review(id, action){
  const t = teams.find(x => x.id === id); if (!t) return;
  if (action === "reject" && !confirmReject(t)) return;
  try {
    const { team } = await api("/api/manage/review", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id, action }) });
    teams = teams.map(x => x.id === id ? team : x); render();
    toast(action === "approve" ? `${team.teamName} approved · ${team.teamId}` : action === "reject" ? `${team.teamName} rejected` : `${team.teamName} moved back to review`);
  } catch (e) { if (e.auth) { showLogin(); toast("Your session expired. Sign in again."); } else toast(e.message); }
}

/* detail drawer */
function fillDrawer(t){
  if (!t) return;
  $("#dTitle").textContent = t.teamName;
  const p = $("#dPill"); p.className = "pill " + t.round1; p.innerHTML = "<i></i>" + (LABEL[t.round1] || "");
  $("#dBody").innerHTML = `
    ${t.teamId ? `<div class="idbox"><div><small>TEAM ID</small><b>${esc(t.teamId)}</b></div><button type="button" id="copyId">Copy</button></div>` : ""}
    <div class="kv">
      <span>Idea title</span><div>${esc(t.ideaTitle)}</div>
      <span>Team size</span><div>${Number(t.teamSize)} members</div>
      <span>Submitted</span><div>${esc(fmtDate(t.createdAt))}</div>
      <span>Abstract</span><div>${esc(t.abstract?.fileName)} · ${Math.max(1, Math.round((t.abstract?.size || 0)/1024))} KB</div>
      ${t.reviewedAt ? `<span>Reviewed</span><div>${esc(fmtDate(t.reviewedAt))}${t.reviewedBy ? " by " + esc(t.reviewedBy) : ""}</div>` : ""}
    </div>
    <p class="sec">Team details</p>
    ${t.members.map((m,i) => `<div class="mem"><b>${esc(m.name)}${i === 0 ? "<em>LEADER</em>" : ""}</b><small>${esc(m.email)}</small><small>${esc(m.year)} year · ${esc(m.college)}</small></div>`).join("")}`;
  const c = $("#copyId"); if (c) c.onclick = () => navigator.clipboard.writeText(t.teamId).then(() => toast("Team ID copied"), () => toast(t.teamId));
  $("#dPdf").href = "/api/manage/abstract?id=" + encodeURIComponent(t.id);
  $("#dApprove").disabled = t.round1 === "approved"; $("#dReject").disabled = t.round1 === "rejected"; $("#dReset").disabled = t.round1 === "under_review";
}
let lastFocus = null;
function openDrawer(id){ openId = id; lastFocus = document.activeElement; fillDrawer(teams.find(t => t.id === id)); const d = $("#drawer"); d.hidden = false; requestAnimationFrame(() => { d.classList.add("open"); $("#scrim").classList.add("open"); $("#dClose").focus(); }); }
function closeDrawer(){ openId = null; const d = $("#drawer"); d.classList.remove("open"); $("#scrim").classList.remove("open"); setTimeout(() => { if (!openId) d.hidden = true; }, 300); lastFocus && lastFocus.focus(); }
$("#dClose").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
addEventListener("keydown", e => { if (e.key === "Escape" && openId) closeDrawer(); });
$("#dApprove").onclick = () => review(openId, "approve");
$("#dReject").onclick = () => review(openId, "reject");
$("#dReset").onclick = () => review(openId, "reset");

/* filters, search, sort */
$$("#tiles [data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
$("#q").oninput = render;
$$("th [data-sort]").forEach(b => b.onclick = () => { const k = b.dataset.sort; sortDir = sortKey === k ? -sortDir : (k === "createdAt" ? -1 : 1); sortKey = k;
  $$("th [data-sort]").forEach(x => x.textContent = x.textContent.replace(/ [↑↓]$/, "")); b.textContent += sortDir > 0 ? " ↑" : " ↓"; render(); });
$("#refresh").onclick = async () => { if (await load()) toast("Updated"); };

/* CSV export: one row per participant */
$("#csv").onclick = () => {
  const cols = ["Team ID","Status","Team name","Team size","Idea title","Role","Name","Email","Year","College","Submitted"];
  const cell = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return `"${s.replace(/"/g,'""')}"`; };   // guard against spreadsheet formulas
  const lines = [cols.join(",")];
  teams.forEach(t => t.members.forEach(m => lines.push([t.teamId || "", LABEL[t.round1], t.teamName, t.teamSize, t.ideaTitle, m.role, m.name, m.email, m.year, m.college, t.createdAt].map(cell).join(","))));
  const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv" }));
  const a = Object.assign(document.createElement("a"), { href:url, download:`hackathon2-registrations-${new Date().toISOString().slice(0,10)}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

who(); load();
}
</script>
